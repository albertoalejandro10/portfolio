faq:
  title: Frequently Asked Questions
  description: Answers to common questions about my experience, technical expertise, and how I work.
  categories:
    - title: Technical Expertise
      questions:
        - label: What technologies do you specialize in?
          content: |
            I specialize in full-stack Nuxt applications with Vue, TypeScript, server routes, API integrations, PostgreSQL, Docker, GitHub Actions, and AWS infrastructure.
        - label: What types of projects have you worked on?
          content: |
            I've developed and maintained SaaS platforms, appointment systems, inventory tools, payment integrations, auto-generated websites, AI-powered features, and now a full-stack learning management system. I can own the product experience while also contributing to backend architecture, data modeling, deployments, and operational decisions.
        - label: How do you ensure code quality?
          content: |
            I follow best practices including TypeScript for type safety, comprehensive code reviews, proactive debugging, and clean architecture principles. In my recent role, I migrated a codebase to TypeScript which reduced production errors by 30%, and performed 20+ code reviews to maintain high standards across the team.
    - title: Working Together
      questions:
        - label: How do you collaborate with teams?
          content: |
            I thrive in collaborative environments, working across product, design, frontend, backend, and infrastructure concerns. I've designed 10+ API contracts following DDD principles, participated in code reviews, and helped shape architecture decisions that keep applications maintainable after launch.
        - label: What is your approach to problem-solving?
          content: |
            I focus on understanding the root cause and delivering thoughtful solutions. I've resolved 80+ bugs across production and staging environments, always prioritizing stability and user experience. I believe in continuous learning—currently exploring Go to better understand backend architecture and performance.
        - label: What is your rate and availability?
          content: |
            My standard rate is $30/hr. I'm available for both contract and full-time opportunities, committed to delivering reliable, maintainable solutions that make a real impact.
    - title: Development Practices
      questions:
        - label: How do you handle API integrations?
          content: |
            I have extensive experience with REST APIs, having integrated over 30 endpoints with robust authentication, error handling, loading states, and data flows. I like to get involved early in contract design so the UI, backend, and database model support the same product goal.
        - label: What's your experience with CI/CD?
          content: |
            I've designed and implemented CI/CD pipelines using GitHub Actions, reducing deployment time by 60%. I focus on automating workflows, ensuring code quality through automated testing, and streamlining the release process for faster, more reliable deployments.
        - label: How do you stay current with technology?
          content: |
            I'm constantly learning and building production systems. Recently, I've been deepening my backend and infrastructure skills through Go, PostgreSQL, Docker, and AWS while continuing to refine my Nuxt and TypeScript workflow. I believe the strongest product developers understand the full path from interface to deployment.

